# Generated by cicd-harness. Extend Hephaestus instead of adding local steps.
name: Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: heliannuuthus/hephaestus/.github/workflows/ci-frontend.yml@main
    permissions:
      contents: read
    with:
      workdir: './'
      node-version: '24.13.0'
      build: 'build'
      type-check: 'type-check'
      pack: true

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    uses: heliannuuthus/hephaestus/.github/workflows/ci-deploy-pages.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      workdir: './'
      node-version: '24.13.0'
      build: 'build:docs'
      artifact-path: 'apps/docs/dist'

  release-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    uses: heliannuuthus/hephaestus/.github/workflows/ci-release-node-package.yml@main
    permissions:
      contents: write
    with:
      workdir: './'
      node-version: '24.13.0'
